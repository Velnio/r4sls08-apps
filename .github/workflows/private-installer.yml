name: Verify public catalog and generic Installer
on:
  push:
    paths: ['velnio_installer/**', 'tests/**', '.github/workflows/private-installer.yml']
  pull_request:
    paths: ['velnio_installer/**', 'tests/**', '.github/workflows/private-installer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      # Native payloads and image publication belong to the private release pipeline.
      # This workflow has no registry/repository credentials and never uploads code.
