name: Verify payload-free Installer
on:
  push:
    paths: ['velnio_installer/**', 'tests/**', '.github/workflows/private-installer.yml']
  pull_request:
    paths: ['velnio_installer/**', 'tests/**', '.github/workflows/private-installer.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -v
      - run: docker build --build-arg BUILD_VERSION=1.0.20 --build-arg BUILD_ARCH=amd64 -t velnio-installer-pat:test velnio_installer
      - run: docker run --rm --entrypoint python -v "$PWD:/src:ro" -w /src velnio-installer-pat:test -m unittest discover -s tests -v
